# Production v2: one public native device ingress, verified v6 multitable router.
[trainer]
host = "0.0.0.0"
port = 19037
public_host = "37.192.228.101"
secret_file = "secrets/trainer.secret"

[pokereye]
backend_host = "gs.eye-panel.com"
backend_port = 443
credential_file = "secrets/eye.agent"
